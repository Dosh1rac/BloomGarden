<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌸 Цветущий сад</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>">
<style>
  :root{
    --pink-50:#fff8fb;
    --pink-100:#ffeef6;
    --pink-200:#ffdbe9;
    --pink-300:#ffc4dc;
    --pink-400:#f4a3c2;
    --pink-500:#e57fa6;
    --pink-600:#cf6a92;
    --sage:#a9c9a4;
    --sage-deep:#7fa87c;
    --cream:#fffaf3;
    --ink:#8a5b72;
    --ink-soft:#b48a9e;
    --white:#fffdfe;
    --shadow:0 12px 34px rgba(207,106,146,.16);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family:"Segoe UI","Trebuchet MS",system-ui,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1200px 700px at 12% -10%, #ffe4ef 0%, transparent 60%),
      radial-gradient(900px 600px at 108% 6%, #fff1f7 0%, transparent 55%),
      linear-gradient(180deg,#fffafd 0%,#ffedf4 48%,#ffe2ec 100%);
    min-height:100vh;overflow-x:hidden;
  }
  body.night{
    background:
      radial-gradient(1000px 600px at 20% -10%, #3b3350 0%, transparent 60%),
      linear-gradient(180deg,#2b2640 0%,#453b5e 55%,#5b4b74 100%);
    color:#f3e6f2;
  }
  body.night .card,body.night .panel{background:rgba(255,255,255,.08);border-color:rgba(255,205,228,.26)}
  body.night .sub,body.night .stat-label{color:#e3c8dd}
  body.night .chip{background:rgba(255,255,255,.10);border-color:rgba(255,205,228,.24);color:#f7e9f4}
  body.night .plant{background:rgba(255,255,255,.07)}
  body.night .plant:hover{background:rgba(255,255,255,.15)}
  body.night .plants-note{color:#dcbfd8}
  body.night .garden{background:linear-gradient(180deg,rgba(92,76,116,.55),rgba(50,42,66,.7))}
  body.night .item{background:rgba(255,255,255,.08);border-color:rgba(255,205,228,.22)}
  body.night .tab{background:rgba(255,255,255,.09);border-color:rgba(255,205,228,.24);color:#e6cfe0}
  body.night .tab.active{background:var(--pink-400);color:#fff;border-color:var(--pink-400)}
  body.night .btn.soft{background:rgba(255,255,255,.12);color:#ffd3e5;border-color:rgba(255,205,228,.34)}
  body.night .rename input{background:rgba(255,255,255,.12);color:#f7e9f4;border-color:rgba(255,205,228,.34)}
  body.night .bar{background:rgba(255,255,255,.14)}
  body.night .garden-title,body.night .garden-name,body.night .logo{color:#ffd0e4}
  body.night .harvest-badge{box-shadow:0 8px 20px rgba(255,150,190,.35)}

  @keyframes sway{0%,100%{transform:rotate(-2.4deg)}50%{transform:rotate(2.4deg)}}
  @keyframes pop{0%{transform:scale(.9);opacity:0}100%{transform:scale(1);opacity:1}}
  @keyframes glowPulse{0%,100%{filter:drop-shadow(0 0 6px rgba(255,186,214,.6))}50%{filter:drop-shadow(0 0 18px rgba(255,160,200,.95))}}
  @keyframes pulseBadge{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-2px) scale(1.05)}}
  @keyframes drop{0%{transform:translateY(-100vh)}100%{transform:translateY(110vh)}}
  @keyframes splash{0%{transform:scale(0);opacity:1}100%{transform:scale(1.8);opacity:0}}
  @keyframes waterPulse{
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }

  .rain-overlay {
    position: fixed; inset: 0; background: rgba(43, 38, 64, 0);
    pointer-events: none; z-index: 44; transition: background 2s ease;
  }
  body.raining .rain-overlay {
    background: rgba(43, 38, 64, 0.45);
    backdrop-filter: blur(1px);
  }

  .rain-drop{
    position:fixed;background:rgba(174,194,224,.5);width:2px;height:18px;
    top:-20px;z-index:45;pointer-events:none;animation:drop linear infinite;
  }
  .water-fx{
    position:absolute;inset:0;pointer-events:none;z-index:10;
    display:flex;justify-content:center;align-items:center;
  }
  .water-fx span{
    position:absolute;width:8px;height:8px;background:#a1d8f5;border-radius:50%;
    animation:splash .6s ease-out forwards;
  }
  .plant.watering svg {
    animation: waterPulse 0.6s ease-out;
  }

  .wrap{position:relative;z-index:1;max-width:1420px;margin:0 auto;padding:22px 22px 70px}

  /* ---------- лепестки ---------- */
  #petals{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
  .petal{
    position:absolute;top:0;left:0;will-change:transform;
    pointer-events:auto;cursor:grab;user-select:none;touch-action:none;
    filter:drop-shadow(0 2px 3px rgba(180,110,140,.25));
    transition:filter .2s ease;
  }
  .petal.dragging{cursor:grabbing;filter:drop-shadow(0 8px 14px rgba(180,110,140,.45)) brightness(1.1)}
  .petal-burst{
    position:fixed;pointer-events:none;z-index:70;font-size:16px;
    animation:burst 1.1s ease-out forwards;
  }

  /* ---------- шапка ---------- */
  header{
    display:flex;align-items:center;gap:16px;flex-wrap:wrap;
    padding:16px 22px;border-radius:26px;
    background:rgba(255,255,255,.68);border:1px solid var(--pink-200);
    box-shadow:var(--shadow);backdrop-filter:blur(10px);
  }
  body.night header{background:rgba(255,255,255,.07);border-color:rgba(255,205,228,.22)}
  .logo{font-size:26px;font-weight:800;letter-spacing:.3px;color:var(--pink-600)}
  .logo span{font-size:22px}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto;align-items:center}
  .chip{
    padding:8px 14px;border-radius:999px;font-size:14px;
    background:var(--white);border:1px solid var(--pink-200);color:var(--ink);
    box-shadow:0 3px 10px rgba(207,106,146,.08);
  }
  .chip.petals{font-weight:800;color:var(--pink-600);background:var(--pink-100)}

  /* ---------- сетка ---------- */
  .layout{display:grid;grid-template-columns:250px minmax(0,1fr) 300px;gap:18px;margin-top:18px;align-items:start}
  @media (max-width:1150px){.layout{grid-template-columns:1fr}}

  .card{
    background:rgba(255,255,255,.74);border:1px solid var(--pink-200);
    border-radius:24px;box-shadow:var(--shadow);padding:18px;backdrop-filter:blur(10px);
  }
  h3{margin:0 0 12px;font-size:15px;letter-spacing:.7px;text-transform:uppercase;color:var(--ink-soft)}
  .sub{font-size:13px;color:var(--ink-soft);margin:2px 0}

  .avatar{
    width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:30px;
    background:linear-gradient(135deg,#ffe0ec,#ffc4dc);
    box-shadow:0 6px 16px rgba(207,106,146,.25);margin-bottom:10px;
  }
  .garden-name{font-weight:800;font-size:18px;color:var(--pink-600)}
  .stat-row{display:flex;justify-content:space-between;font-size:14px;padding:7px 0;border-bottom:1px dashed var(--pink-200)}
  .stat-row:last-child{border-bottom:none}
  .stat-label{color:var(--ink-soft)}
  .stat-value{font-weight:700}

  /* ---------- сад ---------- */
  .garden{
    position:relative;min-height:520px;border-radius:28px;overflow:hidden;
    background:
      radial-gradient(900px 380px at 50% 116%, rgba(255,226,238,.9) 0%, rgba(255,245,250,.15) 60%),
      linear-gradient(180deg,rgba(255,255,255,.8),rgba(255,236,245,.55));
    border:1px solid var(--pink-200);box-shadow:var(--shadow);padding:22px 22px 140px;
  }
  .garden-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:4px;flex-wrap:wrap;position:relative;z-index:4}
  .garden-title{font-size:17px;font-weight:800;color:var(--pink-600)}
  .plants-note{font-size:13px;color:var(--ink-soft)}

  .btn{
    border:none;cursor:pointer;padding:10px 16px;border-radius:999px;
    background:linear-gradient(135deg,var(--pink-400),var(--pink-500));
    color:#fff;font-weight:700;font-size:14px;
    box-shadow:0 6px 16px rgba(229,127,166,.35);
    transition:transform .15s ease,box-shadow .15s ease,filter .15s ease;
    font-family:inherit;
  }
  .btn:hover{transform:translateY(-1px);box-shadow:0 9px 20px rgba(229,127,166,.45)}
  .btn:active{transform:translateY(1px) scale(.99)}
  .btn.soft{background:var(--white);color:var(--pink-600);border:1px solid var(--pink-300);box-shadow:0 4px 12px rgba(207,106,146,.12)}
  .btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}

  .plants{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-top:14px;position:relative;z-index:4;min-height:220px;}
  .plant{
    position:relative;cursor:pointer;border-radius:22px;padding:12px 8px 14px;
    background:rgba(255,255,255,.6);border:2px solid transparent;
    transition:transform .18s ease,border-color .18s ease,background .18s ease,box-shadow .18s ease;
    animation:pop .3s ease both;text-align:center;
  }
  .plant:hover{transform:translateY(-3px);background:rgba(255,255,255,.86);box-shadow:0 10px 24px rgba(207,106,146,.14)}
  .plant.selected{border-color:var(--pink-400);background:rgba(255,255,255,.95);box-shadow:0 12px 26px rgba(207,106,146,.18)}
  .plant.ready{border-color:#ffc7a8;box-shadow:0 0 0 3px rgba(255,205,170,.28)}
  .plant svg{display:block;margin:0 auto;transform-origin:50% 92%;overflow:visible;filter:drop-shadow(0 5px 4px rgba(110,91,95,.14))}
  .plant .pname{font-size:14.5px;font-weight:700;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .plant .pstage{font-size:11.5px;color:var(--ink-soft)}
  .rarity{position:absolute;top:8px;right:8px;font-size:9.5px;font-weight:800;letter-spacing:.5px;padding:3px 7px;border-radius:999px;text-transform:uppercase}
  .r-Обычный{background:#e7f6ea;color:#4f8f63}
  .r-Редкий{background:#e2efff;color:#4f83ca}
  .r-Особенный{background:#f1e3ff;color:#8153c9}
  .r-Легендарный{background:#fff0cf;color:#c2912a}
  .r-Мифический{background:#dff8ff;color:#2f9aab}
  .wilt{opacity:.86;filter:saturate(.62)}

  .harvest-badge{
    position:absolute;left:50%;bottom:-14px;transform:translateX(-50%);
    border:none;cursor:pointer;font-family:inherit;font-weight:800;font-size:12px;
    padding:7px 13px;border-radius:999px;color:#7a4b2a;
    background:linear-gradient(135deg,#ffe1a8,#ffc07a);
    box-shadow:0 8px 20px rgba(255,160,110,.45);
    animation:pulseBadge 1.8s ease-in-out infinite;white-space:nowrap;
    border:1.5px solid rgba(255,255,255,.7);z-index:5;
  }
  .harvest-badge:hover{filter:brightness(1.05)}
  .harvest-timer{font-size:10.5px;color:#b98a5f;margin-top:10px}

  .note-badge{
    position:absolute;left:8px;top:8px;z-index:6;border:none;cursor:pointer;font-family:inherit;
    font-size:15px;padding:5px 8px;border-radius:999px;pointer-events:auto;
    background:rgba(255,255,255,.9);border:1.5px solid var(--pink-300);
    animation:glowPulse 3s ease-in-out infinite;line-height:1;
  }
  .secret-note-button{
    display:block;margin:8px auto 0;border:1px solid #f3b5cd;border-radius:999px;
    background:#fff7fb;color:#bf668b;padding:6px 12px;font:700 11px inherit;cursor:pointer;
    box-shadow:0 3px 9px rgba(207,106,146,.12);position:relative;z-index:5;
  }
  .secret-note-button:hover{background:#ffe9f2}

  /* ---------- декор ---------- */
  .decor-layer{position:fixed;inset:0;z-index:30;pointer-events:none}
  .garden::after{
    content:"";position:absolute;left:0;right:0;bottom:0;height:132px;z-index:2;pointer-events:none;
    background:linear-gradient(180deg,rgba(196,228,193,0),rgba(184,222,182,.38) 45%,rgba(160,207,160,.5));
    border-radius:0 0 28px 28px;
  }
  body.night .garden::after{background:linear-gradient(180deg,rgba(70,90,80,0),rgba(52,76,66,.45))}
  .decor-item{
    position:absolute;pointer-events:auto;transform-origin:50% 100%;
    transition:filter .2s ease;cursor:grab;touch-action:none;user-select:none;
  }
  .decor-item.dragging{cursor:grabbing;filter:drop-shadow(0 10px 18px rgba(120,160,120,.4)) brightness(1.06);z-index:10}
  .decor-item.placed{transition:filter .2s ease,transform .2s ease}
  .decor-item.placed:hover{transform:scale(1.08);filter:drop-shadow(0 8px 14px rgba(120,160,120,.35))}
  .decor-item svg{display:block}
  .decor-item .tip{
    position:absolute;left:50%;top:-20px;transform:translateX(-50%);
    background:rgba(255,255,255,.92);color:var(--pink-600);font-size:10.5px;font-weight:700;
    padding:3px 8px;border-radius:999px;opacity:0;white-space:nowrap;transition:.18s;pointer-events:none;
  }
  .decor-item:hover .tip{opacity:1;top:-24px}
  .decor-item.butterfly{animation:floatButterfly 6s ease-in-out infinite}
  .decor-item.butterfly.dragging{animation:none}

  /* ---------- правая панель ---------- */
  .detail-emoji{font-size:44px;text-align:center}
  .bars{margin:10px 0 4px}
  .bar-label{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft);margin-top:10px}
  .bar{height:9px;border-radius:999px;background:var(--pink-100);overflow:hidden;margin-top:5px}
  .bar>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--pink-300),var(--pink-500));transition:width .4s ease}
  .actions{display:flex;flex-direction:column;gap:9px;margin-top:16px}
  .actions .btn{width:100%}
  .rename{display:flex;gap:8px;margin-top:12px}
  .rename input{
    flex:1;min-width:0;padding:10px 12px;border-radius:14px;border:1px solid var(--pink-300);
    font-family:inherit;font-size:14px;color:var(--ink);background:var(--white);outline:none;
  }
  .rename input:focus{border-color:var(--pink-400);box-shadow:0 0 0 3px rgba(244,163,194,.25)}

  /* ---------- низ ---------- */
  .bottom{margin-top:18px}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .tab{
    border:1px solid var(--pink-200);background:var(--white);color:var(--ink-soft);
    padding:9px 16px;border-radius:999px;cursor:pointer;font-weight:700;font-size:13.5px;font-family:inherit;transition:.18s;
  }
  .tab.active{background:var(--pink-400);color:#fff;border-color:var(--pink-400);box-shadow:0 6px 16px rgba(229,127,166,.3)}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
  .item{
    background:var(--white);border:1px solid var(--pink-200);border-radius:20px;padding:14px;
    display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center;
    transition:.18s;box-shadow:0 4px 12px rgba(207,106,146,.07);
  }
  .item:hover{transform:translateY(-3px);box-shadow:0 12px 24px rgba(207,106,146,.16)}
  .item .ico{font-size:30px}
  .item .nm{font-weight:700;font-size:14px}
  .item .price{font-size:12.5px;color:var(--pink-600);font-weight:800}
  .item .btn{padding:7px 14px;font-size:12.5px;width:100%}

  /* ---------- тосты и модалки ---------- */
  #toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:10px;z-index:80}
  .toast{
    background:var(--white);border:1px solid var(--pink-300);color:var(--ink);
    padding:12px 16px;border-radius:16px;box-shadow:var(--shadow);font-size:14px;font-weight:600;
    animation:pop .25s ease both;max-width:280px;
  }
  .toast.bad{border-color:#f0b3b3;color:#b35454}
  .toast.good{border-color:#ffd08a;background:linear-gradient(135deg,#fffaf0,#fff0d8)}

  .overlay{
    position:fixed;inset:0;background:rgba(138,91,114,.35);backdrop-filter:blur(4px);
    display:grid;place-items:center;z-index:90;padding:20px;
  }
  .modal{
    background:linear-gradient(180deg,#fffdfe,#fff0f6);border:1px solid var(--pink-300);
    border-radius:28px;box-shadow:0 24px 60px rgba(207,106,146,.35);
    padding:30px;max-width:380px;text-align:center;animation:pop .3s ease both;
  }
  .modal h2{margin:6px 0 8px;color:var(--pink-600);font-size:22px}
  .modal p{color:var(--ink-soft);font-size:14px;line-height:1.55;margin:0 0 18px}
  .gift{font-size:52px;animation:glowPulse 3s ease-in-out infinite}
  .hidden{display:none!important}
  .empty-msg{
    grid-column: 1 / -1;
    text-align: center;
    padding: 60px 20px;
    color: var(--ink-soft);
    font-style: italic;
    background: rgba(255,255,255,0.2);
    border-radius: 24px;
    border: 2px dashed var(--pink-200);
    margin: 20px 0;
    font-size: 15px;
    line-height: 1.6;
  }
</style>
</head>
<body>

<div class="rain-overlay" id="rainOverlay"></div>
<div id="petals"></div>
<div class="decor-layer" id="decorLayer"></div>

<div class="wrap">
  <header>
    <div class="logo"><span>🌸</span> Цветущий сад</div>
    <div class="chips">
      <div class="chip" id="seasonChip">🌷 весна</div>
      <div class="chip" id="timeChip">☀️ день</div>
      <div class="chip" id="moodChip">✨ сад сияет</div>
      <div class="chip petals" id="petalsChip">🌸 0</div>
    </div>
  </header>

  <div class="layout">
    <aside class="card">
      <div class="avatar">🌷</div>
      <div class="garden-name" id="gardenName">Мой сад</div>
      <div class="sub">маленький уютный мир</div>
      <div style="margin-top:14px">
        <div class="stat-row"><span class="stat-label">Растений</span><span class="stat-value" id="statPlants">0</span></div>
        <div class="stat-row"><span class="stat-label">Взрослых</span><span class="stat-value" id="statAdults">0</span></div>
        <div class="stat-row"><span class="stat-label">Декор</span><span class="stat-value" id="statDecor">0</span></div>
        <div class="stat-row"><span class="stat-label">Лепестки</span><span class="stat-value" id="statPetals">0</span></div>
      </div>
      <button class="btn soft" style="width:100%;margin-top:16px" onclick="rainAll()">🌧️ Позвать дождик</button>
    </aside>

    <section class="garden">
      <div class="garden-head">
        <div class="garden-title">🌿 Твой сад</div>
        <div class="plants-note" id="gardenHint">Нажми на цветок, чтобы позаботиться о нём</div>
      </div>
      <div class="plants" id="plants"></div>
    </section>

    <aside class="card" id="detailPanel">
      <h3>Растение</h3>
      <div id="detailEmpty" class="sub">Выбери цветок в саду — и здесь появятся его секретики.</div>
      <div id="detailBody" class="hidden">
        <div class="detail-emoji" id="dEmoji">🌷</div>
        <div style="text-align:center;font-weight:800;font-size:18px" id="dName">—</div>
        <div style="text-align:center" class="sub" id="dSpecies">—</div>
        <div class="bars">
          <div class="bar-label"><span>Влажность</span><span id="dWaterTxt">—</span></div>
          <div class="bar"><i id="dWaterBar" style="width:50%"></i></div>
          <div class="bar-label"><span>Состояние</span><span id="dHealthTxt">—</span></div>
          <div class="bar"><i id="dHealthBar" style="width:100%"></i></div>
        </div>
        <div class="actions">
          <button class="btn" onclick="act('water')">💧 Полить</button>
          <button class="btn soft" onclick="act('feed')">🌿 Удобрить · 10 🌸</button>
          <button class="btn soft" id="dHarvestBtn" onclick="harvestSelected()">🌸 Собрать урожай</button>
        </div>
        <div class="sub" id="dHarvestHint" style="text-align:center;margin-top:8px"></div>
        <div class="rename">
          <input id="renameInput" maxlength="24" placeholder="Дай имя цветку">
          <button class="btn" onclick="renamePlant()">✓</button>
        </div>
      </div>
    </aside>
  </div>

  <section class="bottom card">
    <div class="tabs">
      <button class="tab active" data-tab="seeds" onclick="switchTab('seeds')">🌱 Семена</button>
      <button class="tab" data-tab="decor" onclick="switchTab('decor')">🏮 Декор</button>
      <button class="tab" data-tab="collection" onclick="switchTab('collection')">📖 Коллекция</button>
    </div>
    <div class="cards" id="shopCards"></div>
  </section>
</div>

<div id="toasts"></div>

<script>
/* =============================================================== физика лепестков */
(function interactivePetals(){
  const layer = document.getElementById('petals');
  const glyphs = ['🌸','🌷','💮','🌺','✿','❀','🩷','🌸'];
  const items = [];
  let W = window.innerWidth, H = window.innerHeight;

  function make(i){
    const el = document.createElement('span');
    el.className = 'petal';
    const size = 14 + Math.random()*12;
    el.textContent = glyphs[i % glyphs.length];
    el.style.fontSize = size + 'px';
    el.style.width = size + 'px';
    el.style.height = size + 'px';
    el.style.lineHeight = size + 'px';
    layer.appendChild(el);

    const p = {
      el, size,
      x: Math.random()*W,
      y: Math.random()*H,
      vx: (Math.random()-.5)*10,
      vy: 14 + Math.random()*26,
      rot: Math.random()*360,
      vr: (Math.random()-.5)*24,
      phase: Math.random()*Math.PI*2,
      dragging: false,
      offX: 0, offY: 0,
      lastT: performance.now(),
      lastX: 0, lastY: 0,
      svx: 0, svy: 0
    };
    el.addEventListener('pointerdown', e => {
      e.preventDefault();
      p.dragging = true;
      el.classList.add('dragging');
      try { el.setPointerCapture(e.pointerId); } catch(err) {}
      p.offX = e.clientX - p.x;
      p.offY = e.clientY - p.y;
      p.lastX = e.clientX; p.lastY = e.clientY;
      p.svx = 0; p.svy = 0;
      p.el.style.zIndex = 50;
    });
    el.addEventListener('pointermove', e => {
      if(!p.dragging) return;
      p.x = e.clientX - p.offX;
      p.y = e.clientY - p.offY;
      p.svx = e.clientX - p.lastX;
      p.svy = e.clientY - p.lastY;
      p.lastX = e.clientX; p.lastY = e.clientY;
      p.rot += Math.abs(p.svx) * .8;
    });
    const release = e => {
      if(!p.dragging) return;
      p.dragging = false;
      el.classList.remove('dragging');
      p.el.style.zIndex = 1;
      p.vx = Math.max(-260, Math.min(260, p.svx * 12));
      p.vy = Math.max(10, Math.min(320, p.svy * 12));
      if(Math.abs(p.svy) < 2) p.vy = 20;
      if(Math.abs(p.svx) < 2) p.vx = 0;
    };
    el.addEventListener('pointerup', release);
    el.addEventListener('pointercancel', release);
    el.addEventListener('lostpointercapture', release);

    items.push(p);
    return p;
  }

  for(let i=0;i<16;i++){
    const p = make(i);
    p.y = Math.random()*H;
  }

  window.addEventListener('resize', () => {
    W = window.innerWidth; H = window.innerHeight;
  });

  let last = performance.now();
  function loop(now){
    const dt = Math.min(.05, (now - last) / 1000);
    last = now;
    for(const p of items){
      if(!p.dragging){
        p.vy += 8 * dt;
        p.vy = Math.min(p.vy, 90);
        p.x += p.vx * dt + Math.sin(now/1400 + p.phase) * 10 * dt;
        p.y += p.vy * dt;
        p.vx *= (1 - 1.4*dt);
        p.rot += p.vr * dt;
        if(p.y > H + 40){
          p.y = -40;
          p.x = Math.random()*W;
          p.vy = 14 + Math.random()*24;
          p.vx = (Math.random()-.5)*10;
          p.rot = Math.random()*360;
        }
        if(p.x < -60) p.x = W + 40;
        if(p.x > W + 60) p.x = -40;
      }
      const scale = p.dragging ? 1.5 : 1;
      p.el.style.transform =
        'translate3d(' + (p.x - p.size/2) + 'px,' + (p.y - p.size/2) + 'px,0) rotate(' + p.rot + 'deg) scale(' + scale + ')';
    }
  }
  setInterval(() => loop(performance.now()), 33);
  window.__petals = items;
})();

/* =============================================================== рендер */
function render(){
  if(!STATE) return;
  const u = STATE.user;
  document.getElementById('petalsChip').textContent = '🌸 ' + u.petals;
  document.getElementById('statPetals').textContent = u.petals;
  document.getElementById('gardenName').textContent = u.name;
  document.getElementById('statPlants').textContent = STATE.plants.length;
  document.getElementById('statAdults').textContent = STATE.plants.filter(p=>p.stage==='взрослый цветок').length;
  document.getElementById('statDecor').textContent = STATE.decor.length;

  document.getElementById('seasonChip').textContent = STATE.season.icon + ' ' + STATE.season.name;
  document.getElementById('timeChip').textContent = STATE.time_of_day.icon + ' ' + STATE.time_of_day.name;
  document.getElementById('moodChip').textContent = '✨ сад ' + STATE.mood;

  document.body.classList.toggle('night', STATE.time_of_day.name === 'ночь' || STATE.time_of_day.name === 'вечер');

  const readyCount = STATE.plants.filter(p => p.can_harvest).length;
  document.getElementById('gardenHint').textContent = readyCount
    ? '🌾 ' + readyCount + ' ' + (readyCount === 1 ? 'цветок готов' : 'цветок готовы') + ' к сбору урожая'
    : 'Нажми на цветок, чтобы позаботиться о нём';
  document.getElementById('gardenHint').style.color = readyCount ? '#c98a3f' : '';

  const box = document.getElementById('plants');
  box.innerHTML = '';
  if(!STATE.plants || !STATE.plants.length){
    box.innerHTML = '<div class="empty-msg">Твой сад пока пуст. <br>Выбери семена в магазине внизу и посади свой первый цветок! 🌱</div>';
  }
  (STATE.plants || []).forEach((p, i) => {
    const el = document.createElement('div');
    el.className = 'plant' + (p.id === selectedId ? ' selected' : '') + (p.can_harvest ? ' ready' : '');
    el.dataset.id = p.id;
    el.style.animationDelay = (i * 40) + 'ms';
    el.onclick = () => {
      selectedId = p.id;
      render();
      if(p.is_secret) showNote();
    };

    let cooldown = '';
    if(p.stage === 'взрослый цветок' && !p.can_harvest && !p.is_secret){
      const h = hoursLeft(p.next_harvest_at);
      if(h) cooldown = `<div class="harvest-timer">🌸 снова через ${h} ч</div>`;
    }

    el.innerHTML = `
      <span class="rarity r-${p.rarity}">${p.rarity}</span>
      ${p.is_secret ? `<button class="note-badge" title="Прочитать записку" onclick="event.stopPropagation();showNote()">💌</button>` : ''}
      ${flowerSVG(p)}
      <div class="pname">${esc(p.name)}</div>
      <div class="pstage">${p.stage} · ${p.status}</div>
      ${p.is_secret ? `<button class="secret-note-button" onclick="event.stopPropagation();showNote()">💌 Прочитать письмо</button>` : ''}
      ${cooldown}
      ${p.can_harvest ? `<button class="harvest-badge" onclick="event.stopPropagation();harvest(${p.id}, this)">🌸 Собрать</button>` : ''}
      <div class="water-fx-container"></div>
    `;
    box.appendChild(el);
  });

  renderDecor();
  renderDetail();
  renderShop();
}

function hoursLeft(iso){
  if(!iso) return '';
  const ms = new Date(iso).getTime() - Date.now();
  if(ms <= 0) return '';
  return Math.max(1, Math.ceil(ms / 3600000));
}

function renderDecor(){
  const layer = document.getElementById('decorLayer');
  layer.innerHTML = '';
  STATE.decor.forEach((d) => {
    const wrapEl = document.createElement('div');
    wrapEl.className = 'decor-item placed' + (d.item === 'butterfly' ? ' butterfly' : '');
    wrapEl.dataset.id = d.id;
    wrapEl.style.left = (d.pos_x != null ? d.pos_x : 10) + '%';
    wrapEl.style.bottom = (d.pos_y != null ? d.pos_y : 10) + '%';
    wrapEl.innerHTML = decorSVG(d.item) + `<span class="tip">${esc(d.name)} · можно передвинуть</span>`;
    makeDraggable(wrapEl, d);
    layer.appendChild(wrapEl);
  });
}

function makeDraggable(el, d){
  let dragging = false, startX = 0, startY = 0, startLeft = 0, startBottom = 0, moved = false;

  el.addEventListener('pointerdown', e => {
    if(e.button !== undefined && e.button !== 0) return;
    e.preventDefault();
    dragging = true; moved = false;
    el.classList.add('dragging');
    el.classList.remove('placed');
    try { el.setPointerCapture(e.pointerId); } catch(err) {}
    const r = el.getBoundingClientRect();
    startX = e.clientX; startY = e.clientY;
    startLeft = r.left;
    startBottom = window.innerHeight - r.bottom;
  });

  el.addEventListener('pointermove', e => {
    if(!dragging) return;
    const vw = window.innerWidth, vh = window.innerHeight;
    const w = el.offsetWidth, h = el.offsetHeight;
    let left = startLeft + (e.clientX - startX);
    let bottom = startBottom - (e.clientY - startY);
    left = Math.max(-20, Math.min(vw - w + 20, left));
    bottom = Math.max(0, Math.min(vh - 20, bottom));
    el.style.left = left + 'px';
    el.style.bottom = bottom + 'px';
    moved = true;
  });

  const release = () => {
    if(!dragging) return;
    dragging = false;
    el.classList.remove('dragging');
    el.classList.add('placed');
    if(!moved) return;
    const vw = window.innerWidth, vh = window.innerHeight;
    const r = el.getBoundingClientRect();
    const xPct = Math.round((r.left + r.width/2) / vw * 1000) / 10;
    const yPct = Math.round((vh - r.bottom) / vh * 1000) / 10;
    el.style.left = xPct + '%';
    el.style.bottom = yPct + '%';
    fetch('/api/decor/move/' + d.id, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({x: xPct, y: yPct})
    }).catch(()=>{});
  };
  el.addEventListener('pointerup', release);
  el.addEventListener('pointercancel', release);
  el.addEventListener('lostpointercapture', release);
}

function renderDetail(){
  const p = STATE.plants.find(x => x.id === selectedId);
  document.getElementById('detailEmpty').classList.toggle('hidden', !!p);
  document.getElementById('detailBody').classList.toggle('hidden', !p);
  if(!p) return;

  document.getElementById('dEmoji').textContent = p.emoji;
  document.getElementById('dName').textContent = p.name;
  document.getElementById('dSpecies').textContent = p.species_name + ' · ' + p.rarity;
  document.getElementById('dWaterTxt').textContent = p.status;
  document.getElementById('dHealthTxt').textContent = Math.round(p.health * 100) + '%';
  document.getElementById('dWaterBar').style.width = Math.round(p.health * 100) + '%';
  document.getElementById('dHealthBar').style.width = Math.round(p.health * 100) + '%';
  document.getElementById('renameInput').value = p.name;

  const btn = document.getElementById('dHarvestBtn');
  const hint = document.getElementById('dHarvestHint');
  if(p.is_secret){
    btn.disabled = true;
    btn.textContent = '💌 Это подарок';
    hint.innerHTML = 'Это цветок-подарок. Нажми на кнопку «Прочитать письмо» на карточке.';
    return;
  }
  btn.disabled = !p.can_harvest;
  if(p.can_harvest){
    btn.textContent = '🌸 Собрать урожай';
    hint.textContent = 'Урожай созрел — забирай лепестки!';
  }else if(p.stage === 'взрослый цветок'){
    const h = hoursLeft(p.next_harvest_at);
    btn.textContent = '🌸 Урожай уже собран';
    hint.textContent = h ? 'Новый урожай примерно через ' + h + ' ч.' : '';
  }else{
    btn.textContent = '🌸 Ещё не вырос';
    hint.textContent = 'Цветок пока растёт — урожай появится позже.';
  }
}

  if(currentTab === 'seeds'){

  if(currentTab === 'collection'){
    const byRarity = {};
    STATE.plants.forEach(p => { byRarity[p.rarity] = (byRarity[p.rarity] || 0) + 1; });
    const all = [
      ['Обычный','🌼'],['Редкий','💎'],['Особенный','🔮'],['Легендарный','👑'],['Мифический','🌙']

/* =============================================================== API и эффекты */
async function api(url, opts){
  const res = await fetch(url, opts);
  const data = await res.json().catch(()=>({}));
  if(!res.ok){
    toast(data.detail || 'Что-то пошло не так', 'bad');
    throw new Error(data.detail || 'error');
  }
  return data;
}

function burst(fromEl){
  if(!fromEl) return;
  const r = fromEl.getBoundingClientRect();
  const cx = r.left + r.width/2;
  const cy = r.top + r.height/2;
  const glyphs = ['🌸','🌷','💮','✿','🌺'];
  for(let i=0;i<12;i++){
    const s = document.createElement('span');
    s.className = 'petal-burst';
    s.textContent = glyphs[i % glyphs.length];
    s.style.left = cx + 'px';
    s.style.top = cy + 'px';
    const ang = Math.random()*Math.PI*2;
    const dist = 40 + Math.random()*90;
    s.style.setProperty('--dx', Math.cos(ang)*dist + 'px');
    s.style.setProperty('--dy', (Math.sin(ang)*dist - 40) + 'px');
    document.body.appendChild(s);
    setTimeout(()=>s.remove(), 1200);
  }
}

async function harvest(id, fromEl){
  try{
    const data = await api('/api/harvest/' + id, {method:'POST'});
    burst(fromEl);
    toast(data.message + (fromEl ? '' : ' 🌾'), 'good');
    await load();
  }catch(e){}
}

function spawnWaterFX(id){
  const card = document.querySelector(`.plant[data-id="${id}"]`);
  if(!card) return;
  
  card.classList.add('watering');
  setTimeout(() => card.classList.remove('watering'), 600);

  for(let i=0; i<8; i++){
    setTimeout(() => {
      const s = document.createElement('span');
      const fx = document.createElement('div');
      fx.className = 'water-fx';
      fx.style.left = (Math.random()*60 - 30) + 'px';
      fx.style.top = (Math.random()*60 - 40) + 'px';
      fx.appendChild(s);
      card.appendChild(fx);
      setTimeout(() => fx.remove(), 600);
    }, i * 60);
  }
}

function startRainVisual(){
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  
  document.body.classList.add('raining');
  const count = 60;
  for(let i=0; i<count; i++){
    const d = document.createElement('div');
    d.className = 'rain-drop';
    d.style.left = Math.random()*100 + 'vw';
    d.style.animationDuration = (0.4 + Math.random()*0.4) + 's';
    d.style.animationDelay = Math.random()*2 + 's';
    document.body.appendChild(d);
    setTimeout(() => d.remove(), 4000);
  }
  setTimeout(() => {
    document.body.classList.remove('raining');
  }, 5000);
}

  ov.querySelector('#takeGift').onclick = async () => {
    try{
      const data = await api('/api/daily', {method:'POST'});
      ov.remove();
      toast(data.message, 'good');
      await load();
    }catch(e){ ov.remove(); }
  };
}

function showWelcome(){
  if(localStorage.getItem('welcomeShown')) return;
  
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = `
    <div class="modal" style="max-width:440px">
      <div class="gift">💗</div>
      <h2 style="font-size:24px">Дорогая моя Юлечка!</h2>
      <p style="white-space:pre-line; text-align:left; font-size:15px; margin:10px 0 24px">Я знаю, как много сил ты отдаешь работе и как сильно устаешь, когда времени на отдых и на саму себя почти не остается.

Я создал этот сад специально для тебя — это твой личный островок тишины, красоты и спокойствия. Пусть здесь время замирает, а эти цветы дарят тебе только улыбку. Заходи сюда, чтобы просто выдохнуть и почувствовать мою заботу.

Ты у меня самая лучшая, самая любимая, близкая и родная. Помни об этом всегда. 💗</p>
      <button class="btn" id="welcomeBtn" style="width:100%; padding:14px">Обнять в ответ</button>
    </div>
  `;
  document.body.appendChild(ov);
  
  const close = () => {
    ov.remove();
    localStorage.setItem('welcomeShown', 'true');
    window.removeEventListener('keydown', escClose);
  };
  
  const escClose = (e) => { if(e.key === 'Escape') close(); };
  window.addEventListener('keydown', escClose);
  
  ov.querySelector('#welcomeBtn').onclick = close;
  ov.onclick = (e) => { if(e.target === ov) close(); };
}

async function load(){
  try{
    STATE = await api('/api/state');
    console.log("Loaded state:", STATE);
    if(!STATE.plants.some(p => p.id === selectedId)) selectedId = null;
    render();
    if(STATE.daily_available) showDaily();
    showWelcome();
  }catch(e){
    console.error("Load error:", e);
    toast('Не удалось загрузить сад', 'bad');
  }
}
setInterval(load, 60000);
load();
</script>
</body>
</html>
